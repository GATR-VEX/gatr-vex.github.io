# Production deploys via Vercel (connect the GitHub repo in the Vercel dashboard).
# This workflow is intentionally a no-op so GitHub Pages is no longer used.
name: Deploy

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Vercel
        run: |
          echo "This project deploys on Vercel, not GitHub Pages."
          echo "Push to main (or open a PR) — Vercel builds and hosts the app."
          echo "Set AUTH_SECRET, AUTH_URL, AUTH_GOOGLE_ID, and AUTH_GOOGLE_SECRET in Vercel."
